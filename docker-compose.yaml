services:
  pgadmin:
    image: dpage/pgadmin4:9.18
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: password
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
  postgres:
    image: pgvector/pgvector:pg17

    environment:
      POSTGRES_DB: ingress_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"
  docling:
    image: quay.io/docling-project/docling-serve:latest
    container_name: docling
    ports:
      - "5001:5001"
    environment:
      - DOCLING_SERVE_MAX_SYNC_WAIT=900
      - DOCLING_SERVE_ENABLE_UI=true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: ai-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    container_name: ai-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    container_name: ai-otel
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./monitoring/otel/collector.yml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.2
    container_name: ai-tempo
    command:
      - -config.file=/etc/tempo.yaml
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped

volumes:
  # Keep your existing volumes here.
  pgadmin_data:
  prometheus_data:
  grafana_data:
  tempo_data: