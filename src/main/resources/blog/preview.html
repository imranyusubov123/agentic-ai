<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Article preview</title>
<style>
:root{font-family:system-ui,sans-serif;color:#18212f;background:#f5f6f8;color-scheme:light}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:40px auto;padding:36px;background:white;border:1px solid #dce1e8;border-radius:12px}header{border-bottom:1px solid #dce1e8;padding-bottom:20px;margin-bottom:32px}.eyebrow{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:#475569}h1{font-size:clamp(1.8rem,5vw,2.5rem);line-height:1.2;letter-spacing:-.03em}h2,h3{line-height:1.3}article{font-size:17px;line-height:1.7;overflow-wrap:anywhere}article>:first-child{margin-top:0}pre{overflow:auto;background:#f1f5f9;padding:16px;border-radius:6px;font-size:14px;line-height:1.6}code{font-family:ui-monospace,monospace}blockquote{border-left:3px solid #94a3b8;margin-left:0;padding-left:18px;color:#475569}figure{margin:28px 0;padding:22px;border:1px solid #cbd5e1;background:#f8fafc;border-radius:8px}.diagram{overflow:auto;min-height:100px;text-align:center}.diagram img{max-width:100%;height:auto}.diagram svg{max-width:100%;min-width:640px;height:auto}figcaption{font-size:.95rem;font-weight:600;margin-top:12px}.description,.note{font-size:.9rem;color:#475569}.notice{border-left:4px solid #b45309;background:#fffbeb;padding:12px 16px;color:#78350f;margin:16px 0}.error{color:#991b1b}a{color:#1d4ed8}a:focus-visible{outline:3px solid #2563eb;outline-offset:4px}details{margin-top:12px}summary{cursor:pointer;min-height:44px;display:flex;align-items:center}.block-id{font-size:11px;color:#64748b;margin-top:4px}table{display:block;overflow:auto;border-collapse:collapse}td,th{border:1px solid #cbd5e1;padding:8px}@media(max-width:600px){main{margin:0;border:0;border-radius:0;padding:22px 18px}figure{padding:12px}}@media(prefers-color-scheme:dark){:root{color-scheme:dark;color:#e2e8f0;background:#0f172a}main{background:#182234;border-color:#334155}pre,figure{background:#111b2b;border-color:#475569}.description,.note,.eyebrow,blockquote{color:#cbd5e1}.block-id{color:#94a3b8}a{color:#93c5fd}.notice{background:#302413;color:#fde68a}.error{color:#fca5a5}}
</style>
</head>
<body><main><header><div class="eyebrow">Editorial preview</div><h1 id="title">Loading article…</h1><p class="note">Draft for human review. Diagrams are generated proposals.</p><a id="download" hidden>View Markdown export</a></header><div id="status" role="status" aria-live="polite"></div><article id="article"></article><section id="pending" aria-label="Visuals needing attention"></section><noscript>Enable JavaScript to load this article and render its diagrams.</noscript></main>
<script type="module">
import {withoutDiagramSource} from "/blog/diagram-markdown.js";
const title = document.getElementById('title'), article = document.getElementById('article');
const status = document.getElementById('status'), pending = document.getElementById('pending');
const base = location.pathname.replace(/\/preview\/?$/, '');
const text = (tag, content, cls) => { const el=document.createElement(tag); el.textContent=content; if(cls)el.className=cls; return el; };
try {
 const response=await fetch(base,{headers:{Accept:'application/json'}});
 if(!response.ok)throw new Error('Article unavailable');
 const run=await response.json(); title.textContent=run.draft.title; document.title=run.draft.title+' — Preview';
 const download=document.getElementById('download'); download.href=base+'/markdown'; download.hidden=false;
 let marked, purify, mermaid;
 try {
  const modules=await Promise.race([Promise.all([
   import('https://cdn.jsdelivr.net/npm/marked@15.0.12/lib/marked.esm.js'),
   import('https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.es.mjs'),
   import('https://cdn.jsdelivr.net/npm/mermaid@11.12.2/dist/mermaid.esm.min.mjs')]), new Promise((_, reject) => setTimeout(() => reject(new Error('Renderer timeout')), 12000))]);
  marked=modules[0].marked; purify=modules[1].default; mermaid=modules[2].default;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'neutral',htmlLabels:false,flowchart:{htmlLabels:false},maxTextSize:12000});
 } catch { status.append(text('p','Preview libraries could not load. Showing article text and saved images. Internet access is needed for rich text formatting.','notice')); }
 if(run.review?.issues?.length)status.append(text('p',`${run.review.issues.length} review finding(s). Review the workflow response before approval.`,'notice'));
 const layout=run.layout ?? {blocks:[],visuals:[]};
 const blocks=layout.blocks.length?layout.blocks:[{id:'article',markdown:run.draft.markdown}];
 for(const block of blocks){
  const section=document.createElement('section');section.id=block.id;
  if(marked && purify) section.innerHTML=purify.sanitize(marked.parse(withoutDiagramSource(block.markdown)),{USE_PROFILES:{html:true},FORBID_TAGS:['img','iframe','form','input','button','style'],FORBID_ATTR:['style']});
  else section.append(text('pre',withoutDiagramSource(block.markdown)));
  article.append(section);
  for(const visual of layout.visuals.filter(v=>v.status==='READY' && v.spec.afterBlockId===block.id)){
   const s=visual.spec, figure=document.createElement('figure'), diagram=text('div','Rendering diagram…','diagram');
   diagram.tabIndex=0;diagram.setAttribute('role','img');diagram.setAttribute('aria-label',s.altText);figure.append(diagram);
   figure.append(text('figcaption',s.caption),text('p',s.altText,'description'));
   if(new URLSearchParams(location.search).get('edit')==='1' && window.parent!==window){
    const edit=()=>window.parent.postMessage({type:'edit-blog-diagram',workflowId:run.id,visualId:s.visualId},location.origin);
    diagram.style.cursor='pointer';diagram.title='Click to edit this diagram';
    diagram.addEventListener('click',edit);
    diagram.addEventListener('keydown',event=>{if(event.key==='Enter' || event.key===' '){event.preventDefault();edit();}});
    const button=text('button','Edit diagram');button.type='button';button.onclick=edit;figure.append(button);
   }
   article.append(figure);
   if(visual.asset?.url && /^\/api\/visuals\/assets\/[0-9a-f-]+\.png$/.test(visual.asset.url)){
    const img=document.createElement('img');img.src=visual.asset.url;img.alt=s.altText;
    img.onerror=()=>diagram.replaceChildren(text('p','Saved visual unavailable. Retry rendering from the editor.','error'));
    diagram.replaceChildren(img);
   } else if(mermaid && (!s.engine || s.engine==='MERMAID')){try { const result=await mermaid.render('diagram-'+s.visualId,s.mermaid);diagram.innerHTML=purify.sanitize(result.svg,{USE_PROFILES:{svg:true,svgFilters:true}}); }
    catch {diagram.replaceChildren(text('p','This diagram could not render. Revise its source before approval.','error'));}}
   else diagram.replaceChildren(text('p','Diagram unavailable. Retry rendering from the editor.','error'));
  }
 }
 const unresolved=layout.visuals.filter(v=>v.status!=='READY');
 if(unresolved.length){pending.append(text('h2','Visuals needing attention'));for(const v of unresolved)pending.append(text('p',`${v.spec.visualId}: ${v.status==='RENDER_FAILED'?(v.error || 'Rendering failed. Retry this visual.') : v.status==='NEEDS_PLACEMENT'?'The anchor changed or was removed. Choose a new position.':'The article changed. Review or replan this diagram.'}`,'notice'));}
} catch {title.textContent='Preview unavailable';status.append(text('p','The article could not be loaded. Check the request ID and confirm that the application has not restarted.','error'));}
</script></body></html>
