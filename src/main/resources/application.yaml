spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
  datasource:
    url: jdbc:postgresql://localhost:5432/ingress_ai
    username: postgres
    password: ${DB_PASSWORD}
  application:
    name: ai-exprementation
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5.6-luna
          reasoning-effort: none
        memory:
          repository:
            jdbc:
              initialize-schema: always
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1536
        distance-type: COSINE_DISTANCE
