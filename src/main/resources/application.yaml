spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false

  datasource:
    url: jdbc:postgresql://localhost:5433/ingress_ai
    username: postgres
    password: postgres

  application:
    name: ai-exprementation

  ai:
    ollama:
      chat:
        model: "qwen3.8:27b"  # Must match your installed Ollama tag
        temperature: 0
        think: false        # If supported by this model
        num-predict: 512
        num-ctx: 4096
        keep-alive: 30m
        format: json

    openai:
      api-key: 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
      chat:
        options:
          model: gpt-5.6-luna
          reasoning-effort: none
        memory:
          repository:
            jdbc:
              initialize-schema: always
      embedding:
        enabled: true
        model: text-embedding-3-small

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1536
        distance-type: COSINE_DISTANCE

docling:
  base-url: http://localhost:5001

management:
  # Disable metrics export to the nonexistent receiver on port 4318.
  otlp:
    metrics:
      export:
        enabled: false

  tracing:
    sampling:
      probability: 1.0

  # Spring Boot 4 trace exporter configuration.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:3000/api/public/otel/v1/traces
          transport: http
          headers:
            Authorization: "Basic cGstbGYtOWZjNGU3NDktYTQ1YS00YTg2LWE2MDctYjY4ODJkMzMxZDk2OnNrLWxmLWIxMDRhY2IxLTc3ODMtNDFkYi05ZDAxLTllOTUzZjE4NzI1YQ=="
            x-langfuse-ingestion-version: "4"


logging:
  level:
    io.opentelemetry.exporter: DEBUG
    org.springframework.boot.actuate.autoconfigure.tracing: DEBUG

banking:
  ai:
    cost:
      model: gpt-5.6-luna
      input-per-million: 0.20
      cached-input-per-million: 0.02
      cache-write-per-million: 0.25
      output-per-million: 1.20
      max-input-tokens: 272000